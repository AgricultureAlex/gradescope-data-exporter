# Path to your Netscape-format cookies file for gradescope.com.
# How to export:
#   1. Install "Get cookies.txt LOCALLY" in Chrome
#   2. Log into gradescope.com (via your school's SSO)
#   3. Click the extension icon → export for gradescope.com
#   4. Save the file and set the path below
COOKIES_PATH: ./cookies.txt

# Output directory (will be created if absent)
OUTPUT_DIR: ./output

# (Optional) Comma-separated course IDs to skip, e.g. "12345, 67890"
# COURSES_TO_SKIP:
